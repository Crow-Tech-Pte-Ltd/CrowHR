# Crow HR for iOS. Generate the Xcode project on the Mac (`xcodegen generate`); the generated
# CrowHR.xcodeproj is not committed. Debug (simulator tests) is ad-hoc "sign to run locally" with
# no team. Release carries the Crow Tech team: scripts/ios-archive-on-mac.sh archives it unsigned
# and scripts/ios-export-on-mac.sh has Apple cloud-sign it for App Store Connect. No entitlements
# or special capabilities.
name: CrowHR
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: crowtech
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.1'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
  configs:
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
      DEVELOPMENT_TEAM: A8GBLXTNHB
targets:
  CrowHR:
    type: application
    platform: iOS
    sources:
      - path: CrowHR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: crowtech.crowhr
        PRODUCT_NAME: CrowHR
        INFOPLIST_FILE: CrowHR/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone and iPad (1.0.0). An app can never drop iPad once it has shipped with it, so the
        # iPad layouts are designed, not stretched: a sidebar, readable content widths, payslips
        # list beside detail, and phone layouts at compact widths (Split View, Slide Over, a narrow
        # Stage Manager window). See apps/ios/README.md "iPad".
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: CrowHR/Info.plist
      properties:
        CFBundleDisplayName: Crow HR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone stays portrait. iPad supports all four orientations, which with no
        # UIRequiresFullScreen also opts it into multitasking (Split View, Slide Over, Stage
        # Manager window resizing). One scene: a second window would share the signed-in state.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - AzeretMono-Regular.ttf
          - AzeretMono-Medium.ttf
          - AzeretMono-SemiBold.ttf
          - Ubuntu-400.ttf
          - Ubuntu-500.ttf
          - Ubuntu-700.ttf
        # QR deep link from the web app (My profile → Mobile app). The sign-in redirect
        # (crowtech.crowhr:/oauth2redirect) is received by ASWebAuthenticationSession and is
        # deliberately not registered here.
        CFBundleURLTypes:
          - CFBundleURLName: crowtech.crowhr.connect
            CFBundleURLSchemes: [crowhr]
        # Background refresh of the notifications inbox (no remote push in v1).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [crowtech.crowhr.refresh]
        # HTTPS everywhere; plain HTTP only reaches LAN hosts (the app also refuses public HTTP).
        # NSAllowsLocalNetworking covers .local and unqualified names. From iOS 17, ATS no longer
        # allows IP addresses by default, so the private IPv4 ranges (RFC 1918) are listed too
        # (https://developer.apple.com/documentation/bundleresources/information-property-list/nsapptransportsecurity/nsallowslocalnetworking).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            10.0.0.0/8:
              NSExceptionAllowsInsecureHTTPLoads: true
            172.16.0.0/12:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.0.0/16:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Shown by iOS before the app first reaches a server on the local network (a LAN install).
        NSLocalNetworkUsageDescription: Crow HR connects to your company's Crow HR server. If that server is on your office network, iOS asks you to allow local network access.
        NSCameraUsageDescription: Crow HR uses the camera to scan your company's connection QR code and to photograph claim receipts and leave documents.
        NSFaceIDUsageDescription: Crow HR uses Face ID to unlock the app when you have turned on biometric unlock.
        NSLocationWhenInUseUsageDescription: Your company asks for your location when you clock in or out. It is sent only to your company's Crow HR server, with that punch.
        NSPhotoLibraryUsageDescription: Choose a photo of a receipt or document to attach to a claim or leave application.
  CrowHRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrowHRTests
      - path: ../mobile-fixtures
        buildPhase: resources
        type: folder
        optional: true
    dependencies:
      - target: CrowHR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: crowtech.crowhr.tests
  CrowHRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CrowHRUITests]
    dependencies:
      - target: CrowHR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: crowtech.crowhr.uitests
        TEST_TARGET_NAME: CrowHR
schemes:
  CrowHR:
    build:
      targets:
        CrowHR: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrowHRTests
        - CrowHRUITests
