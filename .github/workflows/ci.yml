name: CI

# What runs when (also on the docs site: developers/testing → "In CI"):
#
# - Every pull request: Biome, the licence check, TypeScript, sg-rules coverage, the OpenAPI
#   snapshot, migrations in sync with the schema, the web and docs builds, and Vitest in six shards.
#   They run in parallel and nothing waits for anything else.
# - Playwright against PostgreSQL 17 and the Docker image + compose install smoke run on every push
#   to main, nightly, on a manual run, and on pull requests that change what they test (the
#   filters in the `changes` job) or carry the `full-ci` label. A skipped job reports "Skipped".
# - Android unit tests + lint when Android files change, and nightly.
#
# For the whole suite on a pull request: add the `full-ci` label, then push or re-run this workflow
# (the label is read when the run starts, so a re-run sees it).
# The dependency audit runs daily in audit.yml and reports in one issue.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 16:37 UTC is 00:37 in Singapore: the runner's UTC date is still the day before, the hour in
    # which a Singapore-date bug showed up (the date picker and claims, 1 Nov 2026).
    - cron: "37 16 * * *"
  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels that pull request's older run. Pushes to main, nightly and
  # manual runs get a group each, so every merged commit gets a complete run (one group for main
  # cancelled 25 of 98 main runs in the four weeks to 22 Nov 2026).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  NODE_VERSION: 24

jobs:
  changes:
    # Job-level filters rather than `on.paths`: on.paths would skip the whole workflow, and the
    # fast checks must run on every pull request. dorny/paths-filter is pinned to a commit SHA
    # (v3.0.4) because it is third-party code reading the repository.
    name: What changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      selfhost: ${{ steps.decide.outputs.selfhost }}
      android: ${{ steps.decide.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        # Nightly and manual runs run everything; they have no diff to filter.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            # Playwright (e2e/*.spec.ts) runs the built web app against the real server on Postgres.
            e2e:
              - 'apps/web/**'
              - 'apps/server/**'
              - 'packages/core/**'
              - 'packages/ui/**'
              - 'packages/sg-rules/src/**'
              - 'packages/demo/src/**'
              - 'e2e/*'
              - 'playwright.config.ts'
              - 'package.json'
              - '**/package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            # e2e/self-host.sh: the image, the compose install, the setup wizard, migrations with
            # their lock, backup/restore, the CLI and the reverse-proxy examples it reads from the docs.
            selfhost:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - 'deploy/hosted/**'
              - '.env.example'
              - 'e2e/hosted-compose.sh'
              - 'e2e/self-host.sh'
              - 'e2e/selfhost.config.ts'
              - 'e2e/setup.spec.ts'
              - 'e2e/fixtures.ts'
              - 'apps/server/**'
              - 'packages/core/drizzle/**'
              - 'packages/core/src/db/**'
              - 'packages/core/src/setup/**'
              - 'packages/core/src/system/**'
              - 'apps/docs/src/content/docs/self-hosting/reverse-proxy.md'
              - 'package.json'
              - '**/package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/android/**'
              - 'apps/mobile-fixtures/**'
              - 'scripts/android-*'
              - '.github/workflows/ci.yml'
      - name: Is the pull request labelled full-ci?
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Read now, not from the event, so that re-running the workflow after adding the label works.
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          full=false
          if grep -qx 'full-ci' <<< "$labels"; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Decide which jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ steps.labels.outputs.full }}
          E2E_PATHS: ${{ steps.filter.outputs.e2e }}
          SELFHOST_PATHS: ${{ steps.filter.outputs.selfhost }}
          ANDROID_PATHS: ${{ steps.filter.outputs.android }}
        run: |
          # Pull requests: by path, or everything with the full-ci label. Main: Playwright and
          # self-host always, Android by path (as before). Nightly and manual runs: everything.
          case "$EVENT" in
            pull_request) all="${FULL_CI_LABEL:-false}" ;;
            push) all=false ;;
            *) all=true ;;
          esac
          pick() { if [ "$all" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          e2e=$(pick "${E2E_PATHS:-false}")
          selfhost=$(pick "${SELFHOST_PATHS:-false}")
          android=$(pick "${ANDROID_PATHS:-false}")
          if [ "$EVENT" = push ]; then e2e=true; selfhost=true; fi
          {
            echo "e2e=$e2e"
            echo "selfhost=$selfhost"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Jobs beyond the fast checks ($EVENT${FULL_CI_LABEL:+, full-ci label: $FULL_CI_LABEL})"
            echo ""
            echo "| Job | Runs |"
            echo "| --- | --- |"
            echo "| Playwright smoke (Postgres 17) | $e2e |"
            echo "| Docker image + compose install smoke | $selfhost |"
            echo "| Android unit tests + lint | $android |"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Third-party licences (no copyleft; THIRD-PARTY-NOTICES.md current)
        run: bun run licences:check
      - name: Typecheck
        run: bun run typecheck
      - name: Statutory rules coverage (95% lines or more)
        run: bun run coverage:sg-rules
      - name: OpenAPI snapshot current and v1 additive-only
        run: bun run openapi:check
      - name: Migrations are consistent and in sync with the schema
        run: |
          bun run --cwd packages/core db:check
          bun run --cwd packages/core db:generate
          test -z "$(git status --porcelain packages/core/drizzle)" || {
            echo "::error::Schema changed without a migration. Run 'bun run db:generate' and commit packages/core/drizzle."
            exit 1
          }
      - name: Build
        run: bun run build
      - name: Docs site build, link and API-coverage check
        run: bun run docs:build

  test:
    # The suite (2,000+ tests in 280 files on in-process PGlite) is too slow for one 4-core hosted
    # runner, so it is split across six: Vitest took 1.4 to 2.6 min per shard, against 2.7 to 3.6 on
    # four (Nov 2026). A self-hosted runner with more cores can use fewer shards.
    name: Unit + integration tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install poppler (PDF text and glyph checks)
        run: sudo apt-get install -y -q poppler-utils
      - name: Vitest (PGlite)
        run: bunx vitest run --shard=${{ matrix.shard }}/6

  e2e:
    name: Playwright smoke (Postgres 17)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crowhr:crowhr@localhost:5432/crowhr
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build web app and run smoke tests against Postgres
        run: bun run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  self-host:
    name: Docker image + compose install smoke (self-hosting)
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Disposable Postgres 17 for the advisory-lock and pg_dump round-trip tests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr_lock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install PostgreSQL 17 client (pg_dump for the round-trip test)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Migration, approval concurrency and backup/restore against real Postgres
        env:
          CROWHR_TEST_POSTGRES_URL: postgres://crowhr:crowhr@localhost:5432/crowhr_lock_test
        # One file at a time: these tests reset and migrate the same disposable database.
        run: |
          bunx vitest run --no-file-parallelism apps/server/src/migrate/migrate.test.ts apps/server/src/backup/restore.test.ts apps/server/src/workflow-concurrency.test.ts
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Validate the dedicated hosted Compose overlay
        run: e2e/hosted-compose.sh
      - name: Build image, docker compose install, setup wizard, backup, restore, Caddy, nginx, Traefik
        # Builds the image from the checkout (amd64 only; release.yml builds and publishes amd64 and
        # arm64) and tears down only its own compose project and proxy containers. The proxies run
        # the examples from the reverse-proxy docs page (needs curl, jq and openssl, on the runner).
        run: e2e/self-host.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-traces
          path: test-results/selfhost/
          retention-days: 7

  android:
    # JVM unit tests (shared mobile fixtures included) and Android lint on the runner's preinstalled
    # SDK. No emulator: the device journeys need the seeded server and an emulator and run locally
    # (apps/android/README.md). Gradle's dependency and wrapper caches come from setup-gradle.
    name: Android unit tests + lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools the app compiles against
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Verifies apps/android/gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
          validate-wrappers: true
      - name: Unit tests and lint
        working-directory: apps/android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:checkLicenceNotices
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
