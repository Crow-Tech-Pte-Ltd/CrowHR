name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  NODE_VERSION: 24

jobs:
  check:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Statutory rules coverage (95% lines or more)
        run: bun run coverage:sg-rules
      - name: OpenAPI snapshot current and v1 additive-only
        run: bun run openapi:check
      - name: Migrations are consistent and in sync with the schema
        run: |
          bun run --cwd packages/core db:check
          bun run --cwd packages/core db:generate
          test -z "$(git status --porcelain packages/core/drizzle)" || {
            echo "::error::Schema changed without a migration. Run 'bun run db:generate' and commit packages/core/drizzle."
            exit 1
          }
      - name: Build
        run: bun run build
      - name: Docs site build, link and API-coverage check
        run: bun run docs:build
      - name: Dependency audit (fail on high or critical)
        run: bun audit --audit-level=high

  test:
    # The suite (2,000+ tests on in-process PGlite) is too slow for one 4-core hosted runner,
    # so it is split across four. A self-hosted runner with more cores can use fewer shards.
    name: Unit + integration tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Vitest (PGlite)
        run: bunx vitest run --shard=${{ matrix.shard }}/4

  e2e:
    name: Playwright smoke (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crowhr:crowhr@localhost:5432/crowhr
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build web app and run smoke tests against Postgres
        run: bun run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  self-host:
    name: Docker image + compose install smoke (self-hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    services:
      # Disposable Postgres 17 for the advisory-lock and pg_dump round-trip tests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr_lock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install PostgreSQL 17 client (pg_dump for the round-trip test)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Migration lock and backup/restore against real Postgres
        env:
          CROWHR_TEST_POSTGRES_URL: postgres://crowhr:crowhr@localhost:5432/crowhr_lock_test
        run: bunx vitest run apps/server/src/migrate/migrate.test.ts apps/server/src/backup/restore.test.ts
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build image, docker compose install, setup wizard, backup, restore, Caddy
        # Builds the image (amd64 only; multi-arch builds wait for publishing approval) and tears
        # down only its own compose project.
        run: e2e/self-host.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-traces
          path: test-results/selfhost/
          retention-days: 7
