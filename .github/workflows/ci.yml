name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  NODE_VERSION: 24

jobs:
  check:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Third-party licences (no copyleft; THIRD-PARTY-NOTICES.md current)
        run: bun run licences:check
      - name: Typecheck
        run: bun run typecheck
      - name: Statutory rules coverage (95% lines or more)
        run: bun run coverage:sg-rules
      - name: OpenAPI snapshot current and v1 additive-only
        run: bun run openapi:check
      - name: Migrations are consistent and in sync with the schema
        run: |
          bun run --cwd packages/core db:check
          bun run --cwd packages/core db:generate
          test -z "$(git status --porcelain packages/core/drizzle)" || {
            echo "::error::Schema changed without a migration. Run 'bun run db:generate' and commit packages/core/drizzle."
            exit 1
          }
      - name: Build
        run: bun run build
      - name: Docs site build, link and API-coverage check
        run: bun run docs:build
      - name: Dependency audit (fail on high or critical)
        run: bun audit --audit-level=high

  test:
    # The suite (2,000+ tests on in-process PGlite) is too slow for one 4-core hosted runner,
    # so it is split across four. A self-hosted runner with more cores can use fewer shards.
    name: Unit + integration tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install poppler (PDF text and glyph checks)
        run: sudo apt-get install -y -q poppler-utils
      - name: Vitest (PGlite)
        run: bunx vitest run --shard=${{ matrix.shard }}/4

  e2e:
    name: Playwright smoke (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crowhr:crowhr@localhost:5432/crowhr
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build web app and run smoke tests against Postgres
        run: bun run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  self-host:
    name: Docker image + compose install smoke (self-hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    services:
      # Disposable Postgres 17 for the advisory-lock and pg_dump round-trip tests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr_lock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install PostgreSQL 17 client (pg_dump for the round-trip test)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Migration lock and backup/restore against real Postgres
        env:
          CROWHR_TEST_POSTGRES_URL: postgres://crowhr:crowhr@localhost:5432/crowhr_lock_test
        # One file at a time: both reset and migrate the same disposable database, and running
        # them in parallel let one drop the schema while the other migrated (a deadlock, 11 Nov 2026).
        run: bunx vitest run --no-file-parallelism apps/server/src/migrate/migrate.test.ts apps/server/src/backup/restore.test.ts
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build image, docker compose install, setup wizard, backup, restore, Caddy, nginx, Traefik
        # Builds the image from the checkout (amd64 only; release.yml builds and publishes amd64 and
        # arm64) and tears down only its own compose project and proxy containers. The proxies run
        # the examples from the reverse-proxy docs page (needs curl, jq and openssl, on the runner).
        run: e2e/self-host.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-traces
          path: test-results/selfhost/
          retention-days: 7

  android-changes:
    # A job-level filter rather than `on.paths`: on.paths would skip the whole CI workflow, and the
    # web/server jobs must keep running on every push. dorny/paths-filter is pinned to a commit
    # SHA (v3.0.4) because it is third-party code reading the repository.
    name: Android files changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'apps/mobile-fixtures/**'
              - 'scripts/android-*'
              - '.github/workflows/ci.yml'

  android:
    # JVM unit tests (shared mobile fixtures included) and Android lint on the runner's preinstalled
    # SDK. No emulator: the device journeys need the seeded server and an emulator and run locally
    # (apps/android/README.md). Gradle's dependency and wrapper caches come from setup-gradle.
    name: Android unit tests + lint
    needs: android-changes
    if: needs.android-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools the app compiles against
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Verifies apps/android/gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
          validate-wrappers: true
      - name: Unit tests and lint
        working-directory: apps/android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:checkLicenceNotices
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
