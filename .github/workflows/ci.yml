name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  NODE_VERSION: 24

jobs:
  check:
    name: Lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + integration tests (Vitest, PGlite)
        run: bun run test
      - name: OpenAPI snapshot current and v1 additive-only
        run: bun run openapi:check
      - name: Migrations are consistent and in sync with the schema
        run: |
          bun run --cwd packages/core db:check
          bun run --cwd packages/core db:generate
          test -z "$(git status --porcelain packages/core/drizzle)" || {
            echo "::error::Schema changed without a migration. Run 'bun run db:generate' and commit packages/core/drizzle."
            exit 1
          }
      - name: Build
        run: bun run build
      - name: Dependency audit (fail on high or critical)
        run: bun audit --audit-level=high

  e2e:
    name: Playwright smoke (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowhr
          POSTGRES_PASSWORD: crowhr
          POSTGRES_DB: crowhr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crowhr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crowhr:crowhr@localhost:5432/crowhr
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build web app and run smoke tests against Postgres
        run: bun run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
